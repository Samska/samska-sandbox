<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samska Store: sample Product art (Bench)</title>
<style>
/* Prototype for the six sample Products of the hosted demo. Original geometric illustrations in the Bench identity
   (docs/design/samska-store/prototypes/bench.html): ink linework, one signal orange-red, specimen stages with a
   25% grid, registration marks and a catalog number. Colors come from the same tokens, so light and dark follow the theme. */
:root {
  --ground: #e4e7e4; --paper: #f7f8f5; --ink: #111518; --muted: #5a6560; --rule: #111518; --hair: #b8beb9; --signal: #ff4a1c;
  --stage-1: #c3d6c9; --stage-2: #f0d9a0; --stage-3: #bcd0e4; --stage-4: #d9c6e4;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1114; --paper: #171b1f; --ink: #eef0ec; --muted: #98a39d; --rule: #eef0ec; --hair: #343c43; --signal: #ff5a2e;
    --stage-1: #3a4d41; --stage-2: #5a4c26; --stage-3: #34475a; --stage-4: #4a3d57;
  }
}
:root[data-theme="dark"] {
  --ground: #0e1114; --paper: #171b1f; --ink: #eef0ec; --muted: #98a39d; --rule: #eef0ec; --hair: #343c43; --signal: #ff5a2e;
  --stage-1: #3a4d41; --stage-2: #5a4c26; --stage-3: #34475a; --stage-4: #4a3d57;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--ground); color: var(--ink); font-family: var(--display); }
h1 { margin: 0 0 4px; font-size: 1.6rem; font-weight: 900; font-stretch: 75%; text-transform: uppercase; line-height: .95; }
.note { margin: 0 0 16px; font-family: var(--mono); font-size: .75rem; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; max-width: 1100px; }
.card { background: var(--paper); border: 1.5px solid var(--rule); border-radius: 6px; box-shadow: 0 .25rem 0 var(--ink); padding: 8px; }
.stage { position: relative; aspect-ratio: 1; border: 1.5px solid var(--rule); border-radius: 6px; overflow: hidden;
  background-image: linear-gradient(color-mix(in srgb, var(--ink) 14%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--ink) 14%, transparent) 1px, transparent 1px);
  background-size: 25% 25%; }
.s1 { background-color: var(--stage-1); } .s2 { background-color: var(--stage-2); } .s3 { background-color: var(--stage-3); } .s4 { background-color: var(--stage-4); }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.no { position: absolute; left: 8px; top: 8px; z-index: 2; font-family: var(--mono); font-size: .65rem; background: var(--paper); border: 1.5px solid var(--rule); padding: 0 5px; border-radius: 3px; }
.name { margin: 10px 2px 2px; font-weight: 900; font-stretch: 75%; text-transform: uppercase; font-size: 1rem; line-height: 1; }
.price { margin: 0 2px; font-family: var(--mono); font-size: .8rem; color: var(--muted); }
</style>
</head>
