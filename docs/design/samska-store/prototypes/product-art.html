<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samska Store: sample Product art (Bench)</title>
<style>
/* Prototype for the six sample Products of the hosted demo. Original geometric illustrations in the Bench identity
   (docs/design/samska-store/prototypes/bench.html): ink linework, one signal orange-red, specimen stages with a
   25% grid, registration marks and a catalog number. Colors come from the same tokens, so light and dark follow the theme. */
:root {
  --ground: #e4e7e4; --paper: #f7f8f5; --ink: #111518; --muted: #5a6560; --rule: #111518; --hair: #b8beb9; --signal: #ff4a1c;
  --stage-1: #c3d6c9; --stage-2: #f0d9a0; --stage-3: #bcd0e4; --stage-4: #d9c6e4;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1114; --paper: #171b1f; --ink: #eef0ec; --muted: #98a39d; --rule: #eef0ec; --hair: #343c43; --signal: #ff5a2e;
    --stage-1: #3a4d41; --stage-2: #5a4c26; --stage-3: #34475a; --stage-4: #4a3d57;
  }
}
:root[data-theme="dark"] {
  --ground: #0e1114; --paper: #171b1f; --ink: #eef0ec; --muted: #98a39d; --rule: #eef0ec; --hair: #343c43; --signal: #ff5a2e;
  --stage-1: #3a4d41; --stage-2: #5a4c26; --stage-3: #34475a; --stage-4: #4a3d57;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--ground); color: var(--ink); font-family: var(--display); }
h1 { margin: 0 0 4px; font-size: 1.6rem; font-weight: 900; font-stretch: 75%; text-transform: uppercase; line-height: .95; }
.note { margin: 0 0 16px; font-family: var(--mono); font-size: .75rem; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; max-width: 1100px; }
.card { background: var(--paper); border: 1.5px solid var(--rule); border-radius: 6px; box-shadow: 0 .25rem 0 var(--ink); padding: 8px; }
.stage { position: relative; aspect-ratio: 1; border: 1.5px solid var(--rule); border-radius: 6px; overflow: hidden;
  background-image: linear-gradient(color-mix(in srgb, var(--ink) 14%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--ink) 14%, transparent) 1px, transparent 1px);
  background-size: 25% 25%; }
.s1 { background-color: var(--stage-1); } .s2 { background-color: var(--stage-2); } .s3 { background-color: var(--stage-3); } .s4 { background-color: var(--stage-4); }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.no { position: absolute; left: 8px; top: 8px; z-index: 2; font-family: var(--mono); font-size: .65rem; background: var(--paper); border: 1.5px solid var(--rule); padding: 0 5px; border-radius: 3px; }
.name { margin: 10px 2px 2px; font-weight: 900; font-stretch: 75%; text-transform: uppercase; font-size: 1rem; line-height: 1; }
.price { margin: 0 2px; font-family: var(--mono); font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<h1>Sample Product art</h1>
<p class="note">Six original illustrations in the Bench style. Theme follows the system; add ?theme=dark or ?theme=light to force it.</p>
<div class="grid" id="grid"></div>
<script>
const t = new URLSearchParams(location.search).get("theme");
if (t) document.documentElement.dataset.theme = t;
const I = "var(--rule)", P = "var(--paper)", S = "var(--signal)";
const ART = {
  "tote": `
    <ellipse cx="200" cy="352" rx="118" ry="12" fill="${I}" opacity=".16"/>
    <path d="M142 150c-6-84 110-84 116 0" fill="none" stroke="${I}" stroke-width="13" stroke-linecap="round"/>
    <path d="M100 150h200l16 196H84z" fill="${P}" stroke="${I}" stroke-width="5" stroke-linejoin="round"/>
    <path d="M100 150h200v26H98z" fill="${I}"/>
    <path d="M94 238h212M91 262h218" stroke="${I}" stroke-width="5"/>
    <rect x="146" y="282" width="108" height="48" fill="${S}" stroke="${I}" stroke-width="5"/>
    <path d="M166 306h68" stroke="${I}" stroke-width="6" stroke-linecap="round"/>`,
  "pour-over": `
    <ellipse cx="200" cy="354" rx="140" ry="12" fill="${I}" opacity=".16"/>
    <path d="M118 270h92l-8 76h-76z" fill="${P}" stroke="${I}" stroke-width="5" stroke-linejoin="round"/>
    <rect x="127" y="300" width="74" height="12" fill="${S}"/>
    <path d="M210 284c36-8 38 42 0 36" fill="none" stroke="${I}" stroke-width="9"/>
    <path d="M222 188h122l-26 -22h-70z" fill="${P}" stroke="${I}" stroke-width="5" stroke-linejoin="round"/>
    <path d="M232 192h104l-28 98h-48z" fill="${I}"/>
    <rect x="252" y="290" width="64" height="12" fill="${I}"/>
    <rect x="236" y="302" width="96" height="44" fill="${P}" stroke="${I}" stroke-width="5"/>
    <circle cx="284" cy="244" r="12" fill="${S}"/>
    <path d="M96 232c-14-18 14-24 0-44M130 232c-14-18 14-24 0-44" fill="none" stroke="${I}" stroke-width="4" stroke-linecap="round"/>`,
  "workbench": `
    <ellipse cx="200" cy="356" rx="160" ry="12" fill="${I}" opacity=".16"/>
    <rect x="44" y="176" width="312" height="34" rx="4" fill="${S}" stroke="${I}" stroke-width="5"/>
    <rect x="68" y="210" width="24" height="142" fill="${I}"/>
    <rect x="308" y="210" width="24" height="142" fill="${I}"/>
    <rect x="68" y="276" width="264" height="14" fill="${I}"/>
    <rect x="104" y="226" width="92" height="42" fill="${P}" stroke="${I}" stroke-width="5"/>
    <circle cx="150" cy="247" r="7" fill="${I}"/>
    <rect x="292" y="132" width="30" height="44" fill="${I}"/>
    <rect x="270" y="150" width="22" height="10" fill="${I}"/>
    <path d="M106 176v-52h14v52M130 176v-34h14v34" stroke="${I}" stroke-width="5" fill="${P}"/>
    <path d="M178 176l56-34 8 14-52 36z" fill="${P}" stroke="${I}" stroke-width="5" stroke-linejoin="round"/>`,
  "linen-apron": `
    <ellipse cx="200" cy="360" rx="108" ry="10" fill="${I}" opacity=".16"/>
    <path d="M150 66c0-26 100-26 100 0l-18 80h-64z" fill="none" stroke="${I}" stroke-width="8" stroke-linejoin="round"/>
    <path d="M150 112h100l12 62 40 176H98l40-176z" fill="${P}" stroke="${I}" stroke-width="5" stroke-linejoin="round"/>
    <path d="M122 190h156" stroke="${I}" stroke-width="5"/>
    <rect x="134" y="242" width="132" height="66" fill="none" stroke="${I}" stroke-width="5"/>
    <path d="M200 242v66" stroke="${I}" stroke-width="5"/>
    <path d="M122 190c-34 6-50 28-62 56M278 190c34 6 50 28 62 56" fill="none" stroke="${I}" stroke-width="8" stroke-linecap="round"/>
    <rect x="150" y="150" width="100" height="14" fill="${S}"/>`,
  "camp-mug": `
    <ellipse cx="200" cy="356" rx="104" ry="12" fill="${I}" opacity=".16"/>
    <path d="M126 150h148l-10 188c0 12-8 16-18 16h-92c-10 0-18-4-18-16z" fill="${P}" stroke="${I}" stroke-width="5" stroke-linejoin="round"/>
    <path d="M274 190c58-8 58 90-4 82" fill="none" stroke="${I}" stroke-width="14" stroke-linecap="round"/>
    <rect x="120" y="136" width="160" height="22" rx="6" fill="${I}"/>
    <rect x="132" y="228" width="136" height="38" fill="${S}"/>
    <path d="M170 100c-14-16 14-22 0-40M206 100c-14-16 14-22 0-40M242 100c-14-16 14-22 0-40" fill="none" stroke="${I}" stroke-width="5" stroke-linecap="round"/>`,
  "serving-board": `
    <ellipse cx="200" cy="352" rx="150" ry="10" fill="${I}" opacity=".16"/>
    <path d="M60 120h190a22 22 0 0 1 22 22v26h66a18 18 0 0 1 18 18v20a18 18 0 0 1-18 18h-66v26a22 22 0 0 1-22 22H60a22 22 0 0 1-22-22V142a22 22 0 0 1 22-22z" fill="${I}" transform="translate(0 12)"/>
    <path d="M60 120h190a22 22 0 0 1 22 22v26h66a18 18 0 0 1 18 18v20a18 18 0 0 1-18 18h-66v26a22 22 0 0 1-22 22H60a22 22 0 0 1-22-22V142a22 22 0 0 1 22-22z" fill="${P}" stroke="${I}" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="328" cy="206" r="10" fill="${I}"/>
    <path d="M62 150h190M62 178h150M62 262h190M62 290h120" stroke="${I}" stroke-width="3" opacity=".3" stroke-linecap="round"/>
    <path d="M84 250l58-72 58 72z" fill="${S}" stroke="${I}" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="122" cy="232" r="5" fill="${P}" stroke="${I}" stroke-width="3"/>
    <circle cx="226" cy="214" r="17" fill="${I}"/>
    <circle cx="212" cy="260" r="13" fill="${P}" stroke="${I}" stroke-width="5"/>
    <circle cx="212" cy="260" r="5" fill="${I}"/>`
};
const ITEMS = [
  { key: "tote", no: "0101", name: "Canvas Market Tote", price: "29.90", stage: 3 },
  { key: "pour-over", no: "0102", name: "Stoneware Pour-Over Set", price: "64.00", stage: 4 },
  { key: "workbench", no: "0103", name: "Workshop Workbench", price: "489.00", stage: 1 },
  { key: "linen-apron", no: "0104", name: "Linen Apron", price: "34.50", stage: 2 },
  { key: "camp-mug", no: "0105", name: "Enamel Camp Mug", price: "12.00", stage: 1 },
  { key: "serving-board", no: "0106", name: "Walnut Serving Board", price: "58.00", stage: 2 }
];
document.getElementById("grid").innerHTML = ITEMS.map(p => `
  <div class="card">
    <div class="stage s${p.stage}"><span class="no">No. ${p.no}</span>
      <svg viewBox="0 0 400 400" role="img" aria-label="${p.name} illustration">${ART[p.key]}</svg></div>
    <p class="name">${p.name}</p><p class="price">${p.price}</p>
  </div>`).join("");
</script>
</body>
</html>
