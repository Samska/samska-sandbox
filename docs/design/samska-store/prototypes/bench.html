<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Samska Store Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Bench: an instrument-maker's object catalog. Objects are specimens with numbers, hang tags, spec sheets and dimension lines; data is set in mono; one signal orange-red on cool grey and ink. */
:root {
  --ground: #e4e7e4;
  --paper: #f7f8f5;
  --paper-2: #d9ddd9;
  --ink: #111518;
  --muted: #5a6560;
  --rule: #111518;
  --hair: #b8beb9;
  --signal: #ff4a1c;
  --signal-ink: #111518;
  --stage-1: #c3d6c9;
  --stage-2: #f0d9a0;
  --stage-3: #bcd0e4;
  --stage-4: #d9c6e4;
  --ok: #0d7a3f;
  --ok-bg: #d3eddc;
  --bad: #b3112f;
  --bad-bg: #f8d9df;
  --wait: #7a5200;
  --wait-bg: #f6e6b4;
  --focus: #0a58ff;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1114; --paper: #171b1f; --paper-2: #232930; --ink: #eef0ec; --muted: #98a39d; --rule: #eef0ec; --hair: #343c43;
    --signal: #ff5a2e; --signal-ink: #111518;
    --stage-1: #3a4d41; --stage-2: #5a4c26; --stage-3: #34475a; --stage-4: #4a3d57;
    --ok: #6fe0a0; --ok-bg: #12301f; --bad: #ff8fa5; --bad-bg: #3a1420; --wait: #ffd36b; --wait-bg: #382b0a; --focus: #7aa6ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0e1114; --paper: #171b1f; --paper-2: #232930; --ink: #eef0ec; --muted: #98a39d; --rule: #eef0ec; --hair: #343c43;
  --signal: #ff5a2e; --signal-ink: #111518;
  --stage-1: #3a4d41; --stage-2: #5a4c26; --stage-3: #34475a; --stage-4: #4a3d57;
  --ok: #6fe0a0; --ok-bg: #12301f; --bad: #ff8fa5; --bad-bg: #3a1420; --wait: #ffd36b; --wait-bg: #382b0a; --focus: #7aa6ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--display); font-stretch: 100%; font-size: 1rem; line-height: 1.5; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 84px; }
h1, h2, h3, h4 { margin: 0; font-family: var(--display); font-weight: 900; font-stretch: 75%; text-transform: uppercase; letter-spacing: -0.01em; line-height: .95; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1200px; margin-inline: auto; }
.mono { font-family: var(--mono); }
.label { font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { position: sticky; top: 0; z-index: 40; background: var(--ground); border-bottom: 1.5px solid var(--rule); }
.top .wrap { display: grid; grid-template-columns: auto 1fr auto; gap: 12px 24px; align-items: center; padding-block: 12px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand b { font-weight: 900; font-stretch: 125%; font-size: 1.35rem; letter-spacing: .02em; line-height: 1; }
.brand small { font-family: var(--mono); font-size: .62rem; letter-spacing: .14em; border: 1.5px solid var(--rule); padding: 1px 5px; border-radius: 3px; align-self: flex-start; }
.search { position: relative; max-width: 520px; justify-self: center; width: 100%; }
.search input { width: 100%; height: 44px; border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: var(--r); padding: 0 40px 0 14px; font-family: var(--mono); font-size: .9rem; }
.search svg { position: absolute; right: 12px; top: 12px; width: 20px; height: 20px; }
.search.off { visibility: hidden; }
.nav { display: flex; gap: 6px; align-items: center; }
.nav a, .nav button { font-family: var(--mono); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; text-decoration: none; height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid transparent; border-radius: var(--r); background: transparent; }
.nav a:hover { border-color: var(--rule); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--ground); }
.nav .slip { background: var(--signal); color: var(--signal-ink); border-color: var(--rule); font-weight: 600; }
.nav .slip b { background: var(--ink); color: var(--ground); min-width: 22px; height: 22px; padding: 0 6px; display: inline-grid; place-items: center; border-radius: 3px; font-size: .75rem; }
@media (max-width: 800px) { .top .wrap { grid-template-columns: 1fr auto; } .search { grid-column: 1 / -1; grid-row: 2; max-width: none; } .search.off { display: none; } .nav .hide-s { display: none; } .nav a, .nav button { padding: 0 8px; font-size: .72rem; } .brand small { display: none; } .nav { gap: 2px; } }

main { padding-block: 28px 56px; }
.demo { background: var(--ink); color: var(--ground); font-family: var(--mono); font-size: .75rem; letter-spacing: .04em; text-align: center; padding: 6px 12px; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
.head { display: flex; justify-content: space-between; gap: 16px; align-items: end; flex-wrap: wrap; margin-bottom: 22px; }
.head h1 { font-size: clamp(2.6rem, 8vw, 5.6rem); }
.head p { max-width: 44ch; color: var(--muted); }
.crumb { font-family: var(--mono); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; text-decoration: none; display: inline-block; margin-bottom: 16px; border-bottom: 1.5px solid var(--rule); }
.bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-block: 1.5px solid var(--rule); padding-block: 10px; margin-bottom: 24px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-family: var(--mono); font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; border: 1.5px solid var(--rule); background: transparent; border-radius: 99px; height: 34px; padding: 0 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--ground); }

/* buttons */
.btn { height: 48px; padding: 0 22px; border: 1.5px solid var(--rule); border-radius: var(--r); background: var(--ink); color: var(--ground); font-family: var(--mono); font-size: .86rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-shadow: 3px 3px 0 var(--rule); transition: transform .08s, box-shadow .08s; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--rule); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--rule); }
.btn.sig { background: var(--signal); color: var(--signal-ink); }
.btn.line { background: var(--paper); color: var(--ink); }
.btn.sm { height: 36px; padding: 0 14px; font-size: .75rem; box-shadow: 2px 2px 0 var(--rule); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
.link { font-family: var(--mono); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; background: none; border: 0; border-bottom: 1.5px solid var(--rule); padding: 0; }

/* catalog grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px 22px; list-style: none; margin: 0; padding: 0; }
.obj { display: grid; gap: 10px; }
.stage { position: relative; aspect-ratio: 1; border: 1.5px solid var(--rule); border-radius: var(--r); overflow: hidden; display: block; text-decoration: none; background-image: linear-gradient(var(--hair) 1px, transparent 1px), linear-gradient(90deg, var(--hair) 1px, transparent 1px); background-size: 25% 25%; background-position: -1px -1px; }
.stage.s1 { background-color: var(--stage-1); } .stage.s2 { background-color: var(--stage-2); } .stage.s3 { background-color: var(--stage-3); } .stage.s4 { background-color: var(--stage-4); }
.stage svg, .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.stage .reg { position: absolute; width: 12px; height: 12px; border: 0 solid var(--rule); z-index: 2; }
.stage .reg.a { left: 8px; top: 8px; border-width: 1.5px 0 0 1.5px; } .stage .reg.b { right: 8px; top: 8px; border-width: 1.5px 1.5px 0 0; }
.stage .reg.c { left: 8px; bottom: 8px; border-width: 0 0 1.5px 1.5px; } .stage .reg.d { right: 8px; bottom: 8px; border-width: 0 1.5px 1.5px 0; }
.stage .no { position: absolute; left: 14px; top: 14px; z-index: 3; font-family: var(--mono); font-size: .7rem; background: var(--paper); border: 1.5px solid var(--rule); padding: 1px 6px; border-radius: 3px; }
.stock { position: absolute; right: 14px; top: 14px; z-index: 3; font-family: var(--mono); font-size: .68rem; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; border: 1.5px solid var(--rule); background: var(--paper); }
.stock.low { background: var(--wait-bg); color: var(--wait); } .stock.out { background: var(--ink); color: var(--ground); }
.tag { position: absolute; left: 14px; bottom: 14px; z-index: 3; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 4px 14px 14px 4px; padding: 5px 14px 5px 22px; font-family: var(--mono); font-weight: 600; font-size: .95rem; }
.tag::before { content: ""; position: absolute; left: 7px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border: 1.5px solid var(--rule); border-radius: 50%; background: var(--ground); }
.addbtn { position: absolute; right: 14px; bottom: 14px; z-index: 4; }
.obj h3 { font-size: 1.5rem; line-height: 1; }
.obj .d { color: var(--muted); font-size: .92rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.obj h3 a { text-decoration: none; }
.skel { background: linear-gradient(90deg, var(--paper-2), var(--paper), var(--paper-2)); background-size: 200% 100%; animation: sh 1.4s linear infinite; border-radius: var(--r); }
@keyframes sh { to { background-position: -200% 0; } }

/* panels */
.panel { background: var(--paper); border: 1.5px solid var(--rule); border-radius: var(--r); padding: clamp(16px, 3vw, 28px); display: grid; gap: 16px; align-content: start; }
.panel h2 { font-size: 1.8rem; }
.notice { border: 1.5px solid var(--rule); border-radius: var(--r); padding: 12px 14px; font-size: .92rem; display: flex; gap: 10px; background: var(--wait-bg); color: var(--wait); }
.notice.ok { background: var(--ok-bg); color: var(--ok); } .notice.bad { background: var(--bad-bg); color: var(--bad); } .notice.plain { background: var(--paper-2); color: var(--ink); }
.empty { border: 1.5px dashed var(--rule); border-radius: var(--r); padding: 44px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.empty svg { width: 72px; height: 72px; }
.split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 880px) { .split { grid-template-columns: 1fr; } }

/* detail */
.sheet { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(18px, 4vw, 48px); align-items: start; }
@media (max-width: 880px) { .sheet { grid-template-columns: 1fr; } }
.dimwrap { position: relative; padding: 0 44px 36px 0; }
.dimwrap .stage { aspect-ratio: 1; }
.dim { position: absolute; font-family: var(--mono); font-size: .72rem; color: var(--ink); }
.dim.h { right: 0; top: 0; bottom: 36px; width: 36px; display: grid; place-items: center; border-left: 0; }
.dim.h::before { content: ""; position: absolute; right: 16px; top: 0; bottom: 0; border-right: 1.5px solid var(--rule); }
.dim.h span { background: var(--ground); padding: 2px 0; writing-mode: vertical-rl; position: relative; right: -2px; }
.dim.w { left: 0; right: 44px; bottom: 0; height: 28px; display: grid; place-items: center; }
.dim.w::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; border-top: 1.5px solid var(--rule); }
.dim.w span { background: var(--ground); padding: 0 8px; position: relative; top: 4px; }
.buy { display: grid; gap: 18px; position: sticky; top: 100px; }
.buy h1 { font-size: clamp(2.8rem, 6vw, 4.8rem); }
.bigprice { font-family: var(--mono); font-weight: 600; font-size: 2.2rem; }
.spec { border-top: 1.5px solid var(--rule); }
.spec div { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--hair); font-size: .9rem; }
.spec dt { font-family: var(--mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); align-self: center; }
.spec dd { margin: 0; font-family: var(--mono); text-align: right; }
.qty { display: inline-flex; border: 1.5px solid var(--rule); border-radius: var(--r); background: var(--paper); }
.qty button { width: 40px; height: 44px; border: 0; background: transparent; font-family: var(--mono); font-size: 1.1rem; }
.qty output { min-width: 34px; display: grid; place-items: center; font-family: var(--mono); border-inline: 1.5px solid var(--rule); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* slip (cart, receipt) */
.slip-paper { background: var(--paper); border: 1.5px solid var(--rule); font-family: var(--mono); font-size: .86rem; padding: 20px 20px 34px; position: relative; display: grid; gap: 10px; -webkit-mask: radial-gradient(circle 6px at 50% 100%, #0000 98%, #000) 0 0 / 16px 100%; mask: radial-gradient(circle 6px at bottom, #0000 98%, #000) 50% 100% / 16px 100% repeat-x, linear-gradient(#000 0 0) 0 0 / 100% calc(100% - 6px) no-repeat; }
.slip-paper hr { border: 0; border-top: 1.5px dashed var(--rule); margin: 4px 0; width: 100%; }
.slip-paper .ln { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.slip-paper .ln small { color: var(--muted); grid-column: 1 / -1; }
.slip-paper .tot { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 600; }
.scrim { position: fixed; inset: 0; background: rgb(8 10 12 / .55); z-index: 70; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(430px, 100%); z-index: 80; background: var(--ground); border-left: 1.5px solid var(--rule); padding: 18px max(18px, env(safe-area-inset-right, 0px)) 18px 18px; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; }
.drawer .lines { overflow-y: auto; display: grid; align-content: start; gap: 12px; }
.line { display: grid; grid-template-columns: 70px 1fr auto; gap: 12px; align-items: center; background: var(--paper); border: 1.5px solid var(--rule); border-radius: var(--r); padding: 8px; }
.line .th { width: 70px; height: 70px; border-radius: 4px; overflow: hidden; position: relative; border: 1.5px solid var(--rule); }
.line .th svg, .line .th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.line h4 { font-size: 1.05rem; }
.line .qty { transform: scale(.82); transform-origin: left; margin-top: 4px; }
.steps { display: flex; gap: 0; margin-bottom: 22px; flex-wrap: wrap; font-family: var(--mono); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
.steps span { border: 1.5px solid var(--rule); padding: 8px 16px; margin-right: -1.5px; display: inline-flex; gap: 8px; background: var(--paper); }
.steps .now { background: var(--ink); color: var(--ground); } .steps .done { background: var(--ok-bg); color: var(--ok); }
.opts { display: grid; gap: 8px; border: 0; padding: 0; margin: 0; }
.opt { display: flex; gap: 12px; align-items: flex-start; border: 1.5px solid var(--rule); border-radius: var(--r); padding: 12px 14px; cursor: pointer; background: var(--paper); }
.opt:has(input:checked) { background: var(--ink); color: var(--ground); }
.opt input { accent-color: var(--signal); margin-top: 4px; width: 18px; height: 18px; }
.opt strong { font-family: var(--mono); text-transform: uppercase; font-size: .85rem; letter-spacing: .05em; display: block; }
.opt span { font-size: .88rem; opacity: .85; }
.stamp { position: absolute; right: 18px; top: 18px; transform: rotate(-9deg); border: 3px double var(--signal); color: var(--signal); font-family: var(--mono); font-weight: 600; letter-spacing: .12em; padding: 4px 12px; text-transform: uppercase; font-size: .85rem; border-radius: 4px; opacity: .9; }
.ticket { background: var(--ink); color: var(--ground); border-radius: var(--r); padding: clamp(22px, 4vw, 44px); display: grid; gap: 16px; position: relative; overflow: hidden; align-content: start; }
.ticket h1 { font-size: clamp(2.6rem, 6vw, 4.8rem); }
.ticket .code { font-family: var(--mono); color: var(--signal); font-size: 1.05rem; letter-spacing: .06em; }
.ticket p { opacity: .8; max-width: 46ch; }
.tl { list-style: none; margin: 0; padding: 0; display: grid; }
.tl li { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; padding-bottom: 20px; position: relative; }
.tl li::before { content: ""; position: absolute; left: 10px; top: 20px; bottom: 0; width: 2px; background: var(--hair); }
.tl li:last-child::before { display: none; }
.tl i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--rule); background: var(--ok); display: block; }
.tl li.todo i { background: var(--paper); } .tl li.now i { background: var(--signal); }
.tl small { font-family: var(--mono); color: var(--muted); }
.pill { font-family: var(--mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border: 1.5px solid var(--rule); border-radius: 99px; display: inline-block; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.wait { background: var(--wait-bg); color: var(--wait); } .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.ink { background: var(--ink); color: var(--ground); }

/* admin ledger */
.ledger { background: var(--paper); border: 1.5px solid var(--rule); border-radius: var(--r); overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 600px; }
th { font-family: var(--mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); text-align: left; padding: 12px 16px; border-bottom: 1.5px solid var(--rule); background: var(--paper-2); }
td { padding: 10px 16px; border-bottom: 1px solid var(--hair); vertical-align: middle; }
td.r, th.r { text-align: right; } td.m { font-family: var(--mono); font-size: .82rem; }
td .th { width: 48px; height: 48px; position: relative; border: 1.5px solid var(--rule); border-radius: 4px; overflow: hidden; }
td .th svg, td .th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 22px; align-items: start; }
@media (max-width: 880px) { .form { grid-template-columns: 1fr; } }
.field { display: grid; gap: 6px; }
.field label { font-family: var(--mono); font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; }
.field input, .field textarea, .field select { height: 46px; border: 1.5px solid var(--rule); background: var(--ground); color: var(--ink); border-radius: var(--r); padding: 0 12px; font: inherit; width: 100%; }
.field textarea { height: 110px; padding: 10px 12px; resize: vertical; }
.field.bad input { border-color: var(--bad); }
.err { color: var(--bad); font-family: var(--mono); font-size: .8rem; }
.drop { border: 2px dashed var(--rule); border-radius: var(--r); min-height: 280px; display: grid; place-items: center; position: relative; overflow: hidden; text-align: center; background: var(--paper-2); }
.drop .prev { position: absolute; inset: 0; } .drop .prev svg, .drop .prev img { width: 100%; height: 100%; object-fit: cover; }
.drop .ctl { position: relative; background: var(--paper); border: 1.5px solid var(--rule); border-radius: var(--r); padding: 12px 16px; display: grid; gap: 6px; justify-items: center; }
.sws { display: flex; gap: 8px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--rule); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ground), 0 0 0 5px var(--rule); }

/* future */
.fut { display: inline-block; font-family: var(--mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; background: var(--signal); color: var(--signal-ink); border: 1.5px solid var(--rule); padding: 2px 8px; border-radius: 3px; margin-bottom: 12px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { background: var(--paper); border: 1.5px solid var(--rule); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; }
.kpi b { font-family: var(--mono); font-size: 2rem; font-weight: 600; line-height: 1.1; }
.kpi svg { width: 100%; height: 36px; }
.phones { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 26px; justify-items: center; }
.phone { width: 280px; border: 2px solid var(--rule); border-radius: 36px; padding: 10px; background: var(--ground); box-shadow: 6px 6px 0 var(--rule); }
.phone .scr { background: var(--ground); border: 1.5px solid var(--rule); border-radius: 26px; height: 540px; overflow: hidden; padding: 14px 12px; display: grid; align-content: start; gap: 10px; position: relative; }
.phone .scr .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.phone .scr .tabbar { position: absolute; left: 0; right: 0; bottom: 0; border-top: 1.5px solid var(--rule); background: var(--paper); display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; font-family: var(--mono); font-size: .6rem; text-transform: uppercase; padding: 8px 0; }
.toasts { display: grid; gap: 10px; max-width: 380px; }
.toast-s { background: var(--paper); border: 1.5px solid var(--rule); border-left: 8px solid var(--signal); border-radius: var(--r); padding: 10px 14px; box-shadow: 3px 3px 0 var(--rule); font-size: .9rem; }
.toast-s b { font-family: var(--mono); font-size: .75rem; text-transform: uppercase; display: block; }
.notes { font-size: .92rem; color: var(--muted); max-width: 60ch; }

/* review bar */
.review { position: fixed; left: 0; right: 0; bottom: 0; z-index: 90; background: var(--ink); color: var(--ground); border-top: 1.5px solid var(--rule); padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-family: var(--mono); font-size: .75rem; }
.review label { text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 8px; align-items: center; }
.review select, .review button { height: 36px; border: 1.5px solid var(--ground); background: var(--ink); color: var(--ground); border-radius: 4px; font: inherit; padding: 0 10px; max-width: 46vw; }
.review .sp { flex: 1; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 200%); background: var(--ink); color: var(--ground); border: 1.5px solid var(--ground); font-family: var(--mono); font-size: .8rem; padding: 10px 16px; border-radius: var(--r); z-index: 95; transition: transform .2s; max-width: calc(100% - 32px); }
.toast.on { transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#market" aria-label="Samska Store, catalog">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="20" r="8" fill="var(--signal)" stroke="currentColor" stroke-width="3"/><path d="M20 3v8" stroke="currentColor" stroke-width="3"/></svg>
    <b>SAMSKA</b><small>STORE</small>
  </a>
  <div class="search" id="searchbox"><input id="q" type="search" placeholder="Search objects by name" aria-label="Search objects by name" autocomplete="off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div>
  <nav class="nav" aria-label="Primary">
    <a id="n-market" href="#market">Catalog</a><a id="n-orders" class="hide-s" href="#orders">Orders</a><a id="n-admin" class="hide-s" href="#admin">Admin</a>
    <button class="slip" id="slipbtn" aria-label="Open order slip">Slip <b class="num" id="slipcount">0</b></button>
  </nav>
</div></header>
<div class="wrap" id="demobar" hidden><div class="demo">PUBLIC DEMO · Synthetic data only · No real payments · Resets regularly</div></div>
<main class="wrap" id="app" tabindex="-1"></main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Order slip" hidden></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="review" id="review" role="region" aria-label="Design review controls">
  <label>Screen <select id="screenSel"></select></label>
  <label>State <select id="stateSel"></select></label>
  <label>Inventory <select id="invSel"><option value="off">hidden</option><option value="on">preview (future)</option></select></label>
  <span class="sp"></span>
  <button id="themeBtn" aria-label="Toggle light and dark theme">Theme</button>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const ICON = { box: '<svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M10 24 36 10l26 14v26L36 64 10 50z"/><path d="M10 24l26 14 26-14M36 38v26"/></svg>' };

/* provisional geometric illustrations on a stage */
const ART = {
  lamp: '<path d="M96 330h130" stroke="#111518" stroke-width="16" stroke-linecap="round"/><path d="M160 330C160 190 205 125 280 112" stroke="#111518" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M250 92l82 40-28 54z" fill="#111518"/><circle cx="306" cy="184" r="12" fill="#ff4a1c"/>',
  vessel: '<ellipse cx="200" cy="336" rx="110" ry="14" fill="#111518" opacity=".18"/><path d="M150 84h100v32c72 30 92 104 60 174-20 40-60 50-110 50s-90-10-110-50c-32-70-12-144 60-174z" fill="#111518"/><ellipse cx="200" cy="84" rx="50" ry="10" fill="#f7f8f5"/><circle cx="165" cy="232" r="10" fill="#ff4a1c"/><circle cx="218" cy="274" r="16" fill="#f7f8f5" opacity=".9"/>',
  tote: '<path d="M150 150c0-72 100-72 100 0" stroke="#111518" stroke-width="14" fill="none" stroke-linecap="round"/><rect x="95" y="150" width="210" height="210" rx="6" fill="#f7f8f5" stroke="#111518" stroke-width="5"/><rect x="135" y="215" width="130" height="14" fill="#111518"/><rect x="135" y="245" width="86" height="14" fill="#111518"/><circle cx="240" cy="304" r="22" fill="#ff4a1c" stroke="#111518" stroke-width="4"/>',
  pour: '<ellipse cx="200" cy="344" rx="120" ry="14" fill="#111518" opacity=".15"/><path d="M110 120h180l-50 124h-80z" fill="#111518"/><rect x="150" y="258" width="100" height="72" rx="10" fill="#f7f8f5" stroke="#111518" stroke-width="5"/><path d="M250 282c40-6 40 36 0 30" stroke="#111518" stroke-width="10" fill="none"/><path d="M200 244v14" stroke="#111518" stroke-width="8"/><rect x="150" y="262" width="100" height="16" fill="#ff4a1c" opacity=".9"/>',
  bench: '<rect x="50" y="176" width="300" height="34" rx="4" fill="#ff4a1c" stroke="#111518" stroke-width="5"/><rect x="76" y="210" width="24" height="146" fill="#111518"/><rect x="300" y="210" width="24" height="146" fill="#111518"/><rect x="76" y="272" width="248" height="12" fill="#111518"/><rect x="118" y="120" width="62" height="56" rx="4" fill="#f7f8f5" stroke="#111518" stroke-width="5"/><circle cx="262" cy="148" r="26" fill="#111518"/>',
  throw_: '<path d="M60 120c80-40 160 40 280 0v200c-120 40-200-40-280 0z" fill="#111518"/><path d="M60 170c80-40 160 40 280 0M60 220c80-40 160 40 280 0M60 270c80-40 160 40 280 0" stroke="#ff4a1c" stroke-width="9" fill="none"/>',
  blank: '<circle cx="200" cy="200" r="70" fill="#111518"/><rect x="180" y="150" width="40" height="100" fill="#ff4a1c"/>'
};
const art = p => p.image ? `<img src="${p.image}" alt="">` : `<svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(p.name)} illustration">${ART[p.art || "blank"]}</svg>`;
const stageCls = p => "s" + (p.stage || 1);
let products = [
  { id: "arc-lamp", no: "0101", name: "Arc Table Lamp", price: 129, stage: 2, art: "lamp", stock: 12, dims: ["H 420 mm", "W 310 mm"], material: "Powder-coated steel", description: "A slim steel arc that throws warm light over a desk or reading chair. Matte black finish and a cloth cord." },
  { id: "terra-vessel", no: "0102", name: "Terra Vessel", price: 68, stage: 1, art: "vessel", stock: 3, dims: ["H 280 mm", "W 240 mm"], material: "Glazed stoneware", description: "Hand-glazed stoneware vessel for stems, brushes or nothing at all." },
  { id: "market-tote", no: "0103", name: "Canvas Market Tote", price: 34, stage: 3, art: "tote", stock: 40, dims: ["H 380 mm", "W 410 mm"], material: "Organic cotton canvas", description: "Heavy organic canvas with a reinforced base. Holds a full week of groceries." },
  { id: "pour-over", no: "0104", name: "Stoneware Pour-Over Set", price: 92, stage: 4, art: "pour", stock: 0, dims: ["H 210 mm", "W 180 mm"], material: "Glazed stoneware", description: "Dripper, carafe and mug in one glazed set. Makes two cups." },
  { id: "workbench", no: "0105", name: "Workshop Workbench", price: 420, stage: 1, art: "bench", stock: 5, dims: ["H 900 mm", "W 1400 mm"], material: "Solid ash, bolted steel", description: "Solid ash top on a bolted steel frame, with a lower shelf for tools." },
  { id: "linen-throw", no: "0106", name: "Linen Throw", price: 54.5, stage: 2, art: "throw_", stock: 18, dims: ["L 1800 mm", "W 1300 mm"], material: "Stonewashed linen", description: "Stonewashed linen blanket that gets softer with every wash." }
];
const S = { screen: "market", state: "normal", q: "", sort: "featured", kind: "all", cart: { "arc-lamp": 2, "linen-throw": 1 }, qty: 1, outcome: "approve", inv: false, sw: 1, draft: null };
const byId = id => products.find(p => p.id === id);
const lines = () => Object.entries(S.cart).map(([id, q]) => ({ p: byId(id), q })).filter(l => l.p);
const total = () => lines().reduce((s, l) => s + l.p.price * l.q, 0);
const count = () => lines().reduce((s, l) => s + l.q, 0);

/* screens and their states */
const SCREENS = [
  ["Now", [["market", "Catalog"], ["product", "Object detail"], ["cart", "Order slip (cart)"], ["checkout", "Checkout"], ["payment", "Payment result"], ["order", "Order"], ["admin", "Admin list"], ["admin-new", "Admin create"], ["admin-edit", "Admin edit"], ["notfound", "Not found"]]],
  ["Next (design only)", [["account", "Account sign-in"], ["orders", "Order history"], ["track", "Delivery tracking"], ["ops", "Operations dashboard"], ["mobile", "Mobile app"]]]
];
const STATES = {
  market: [["normal", "Loaded"], ["loading", "Loading"], ["empty", "No objects yet"], ["error", "Could not load"]],
  product: [["normal", "Loaded"], ["pending", "Adding to slip"], ["soldout", "Sold out (inventory)"]],
  cart: [["filled", "With items"], ["empty", "Empty"], ["pending", "Updating"], ["error", "Could not update"]],
  checkout: [["normal", "Review"], ["empty", "Empty slip"], ["changed", "Slip changed"]],
  payment: [["approved", "Approved"], ["declined", "Declined"], ["failed", "Temporary failure"], ["changed", "Cart changed"], ["checking", "Checking this attempt"], ["lookup", "Could not check"]],
  order: [["created", "Order created"], ["creating", "Creating order"], ["error", "Could not create"]],
  admin: [["list", "List"], ["empty", "Empty"], ["error", "Could not load"], ["delete", "Confirm delete"]],
  "admin-new": [["form", "Empty form"], ["invalid", "Validation errors"], ["upload", "Image uploaded"], ["badfile", "Unsupported file"]],
  "admin-edit": [["form", "Editing"], ["gone", "Object no longer exists"]],
  account: [["signin", "Sign in"], ["create", "Create account"]],
  orders: [["list", "History"], ["empty", "No orders yet"]],
  track: [["transit", "In transit"], ["delivered", "Delivered"], ["delayed", "Delayed"]]
};
function fillSelectors() {
  $("#screenSel").innerHTML = SCREENS.map(([g, items]) => `<optgroup label="${g}">${items.map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</optgroup>`).join("");
}
function syncSelectors() {
  const r = route(); $("#screenSel").value = ["product"].includes(r.name) ? "product" : r.name === "admin-edit" ? "admin-edit" : r.name;
  const st = STATES[r.name] || []; $("#stateSel").innerHTML = st.length ? st.map(([k, l]) => `<option value="${k}">${l}</option>`).join("") : '<option value="">n/a</option>';
  $("#stateSel").disabled = !st.length; if (st.length) { if (!st.some(([k]) => k === S.state)) S.state = st[0][0]; $("#stateSel").value = S.state; }
}

/* routing */
const go = h => { location.hash = h; };
function route() {
  const h = location.hash.slice(1) || "market";
  if (h.startsWith("product-")) return { name: "product", id: h.slice(8) };
  if (h.startsWith("admin-edit")) return { name: "admin-edit", id: h.slice(11) || products[0].id };
  return { name: h };
}
const DEFAULT_STATE = { market: "normal", product: "normal", cart: "filled", checkout: "normal", payment: "approved", order: "created", admin: "list", "admin-new": "form", "admin-edit": "form", account: "signin", orders: "list", track: "transit" };
function render() {
  const r = route(); const app = $("#app");
  if (!(STATES[r.name] || []).some(([k]) => k === S.state)) S.state = DEFAULT_STATE[r.name] || "";
  $("#searchbox").classList.toggle("off", r.name !== "market");
  $("#demobar").hidden = !S.inv && r.name !== "account";
  ["market", "orders", "admin"].forEach(k => $("#n-" + k).setAttribute("aria-current", (k === "market" && ["market", "product", "checkout", "payment", "order", "cart"].includes(r.name)) || (k === "orders" && ["orders", "track"].includes(r.name)) || (k === "admin" && r.name.startsWith("admin")) ? "page" : "false"));
  $("#slipcount").textContent = count();
  const views = { market: vMarket, product: vProduct, cart: vMarket, checkout: vCheckout, payment: vPayment, order: vOrder, admin: vAdmin, "admin-new": vForm, "admin-edit": vForm, notfound: vNotFound, account: vAccount, orders: vOrders, track: vTrack, ops: vOps, mobile: vMobile };
  const v = Object.prototype.hasOwnProperty.call(views, r.name) ? views[r.name] : vNotFound;
  app.innerHTML = v(r);
  if (r.name === "market" || r.name === "cart") paintGrid();
  if (r.name === "admin-new" || r.name === "admin-edit") bindForm(r);
  openSlip(r.name === "cart");
  syncSelectors();
}
window.addEventListener("hashchange", () => { S.qty = 1; window.scrollTo(0, 0); render(); });

/* helpers */
const obj = (p, withAdd = true) => `<li class="obj"><div class="stage ${stageCls(p)}">${art(p)}<i class="reg a"></i><i class="reg b"></i><i class="reg c"></i><i class="reg d"></i><span class="no">No. ${p.no}</span>${S.inv ? stockBadge(p) : ""}<span class="tag num">${fmt(p.price)}</span>${withAdd ? `<button class="btn sig sm addbtn" data-add="${p.id}" aria-label="Add ${esc(p.name)} to slip" ${S.inv && p.stock === 0 ? "disabled" : ""}>+ Add</button>` : ""}</div>
  <h3><a href="#product-${p.id}">${esc(p.name)}</a></h3><p class="d">${esc(p.description)}</p></li>`;
const stockBadge = p => p.stock === 0 ? '<span class="stock out">Sold out</span>' : p.stock <= 5 ? `<span class="stock low">${p.stock} left</span>` : '<span class="stock">In stock</span>';
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2200); }
const stepRail = n => `<div class="steps" aria-label="Progress">${["Slip", "Payment", "Order"].map((s, i) => `<span class="${i + 1 < n ? "done" : i + 1 === n ? "now" : ""}" ${i + 1 === n ? 'aria-current="step"' : ""}>${i + 1 < n ? "✓" : "0" + (i + 1)} ${s}</span>`).join("")}</div>`;
const slipLines = L => L.map(({ p, q }) => `<div class="ln"><span>${q} × ${esc(p.name)}</span><span class="num">${fmt(p.price * q)}</span><small>No. ${p.no} · ${fmt(p.price)} each</small></div>`).join("");

/* market */
function vMarket() {
  const st = S.state;
  return `<div class="head"><div><p class="label">Samska Store · Object catalog</p><h1>Objects<br>worth keeping</h1></div><p>Plain things, made well. Every object is catalogued with a number, a material and its measurements.</p></div>
  <div class="bar"><div class="chips" role="group" aria-label="Sort">${[["featured", "Catalog order"], ["low", "Price ↑"], ["high", "Price ↓"], ["az", "A–Z"]].map(([k, l]) => `<button class="chip" data-sort="${k}" aria-pressed="${S.sort === k}">${l}</button>`).join("")}</div><span class="label" id="ccount" aria-live="polite"></span></div>
  <ul class="grid" id="grid"></ul><div id="mstate"></div>`;
}
function paintGrid() {
  let L = products.filter(p => p.name.toLowerCase().includes(S.q.trim().toLowerCase()));
  if (S.sort === "low") L = [...L].sort((a, b) => a.price - b.price);
  if (S.sort === "high") L = [...L].sort((a, b) => b.price - a.price);
  if (S.sort === "az") L = [...L].sort((a, b) => a.name.localeCompare(b.name));
  const st = S.state, g = $("#grid"), ms = $("#mstate");
  if (st === "loading") { $("#ccount").textContent = "Loading…"; g.innerHTML = [1, 2, 3, 4].map(() => `<li class="obj"><div class="skel" style="aspect-ratio:1"></div><div class="skel" style="height:26px;width:70%"></div><div class="skel" style="height:16px"></div></li>`).join(""); ms.innerHTML = '<p class="notice plain" role="status" style="margin-top:20px">Loading objects…</p>'; return; }
  if (st === "empty") { $("#ccount").textContent = "0 objects"; g.innerHTML = ""; ms.innerHTML = `<div class="empty">${ICON.box}<h2>The shelf is empty</h2><p class="notes">No objects are catalogued yet. Create a synthetic object in Admin to start a First Order.</p><a class="btn sig" href="#admin-new">Create an object</a></div>`; return; }
  if (st === "error") { $("#ccount").textContent = ""; g.innerHTML = ""; ms.innerHTML = '<div class="notice bad" role="alert"><span>The catalog could not be loaded. Nothing was changed.</span></div><p style="margin-top:12px"><button class="btn line" id="retry">Retry</button></p>'; return; }
  $("#ccount").textContent = S.q.trim() ? `${L.length} of ${products.length} objects` : `${products.length} objects`;
  g.innerHTML = L.map(p => obj(p)).join("");
  ms.innerHTML = L.length ? "" : `<div class="empty"><h2>No match for “${esc(S.q.trim())}”</h2><p class="notes">Check the spelling or clear the search to see every object.</p><button class="btn line" id="clr">Clear search</button></div>`;
}
$("#q").addEventListener("input", e => { S.q = e.target.value; if (route().name === "market") paintGrid(); });

/* detail */
function vProduct(r) {
  const p = byId(r.id); if (!p) return vNotFound();
  const sold = S.state === "soldout" || (S.inv && p.stock === 0);
  return `<a class="crumb" href="#market">← Back to catalog</a>
  <div class="sheet"><div class="dimwrap"><div class="stage ${stageCls(p)}">${art(p)}<i class="reg a"></i><i class="reg b"></i><i class="reg c"></i><i class="reg d"></i><span class="no">No. ${p.no}</span></div>
    <div class="dim h"><span>${p.dims[0]}</span></div><div class="dim w"><span>${p.dims[1]}</span></div></div>
  <div class="buy"><p class="label">Object No. ${p.no}</p><h1>${esc(p.name)}</h1><div class="bigprice num">${fmt(p.price)}</div><p>${esc(p.description)}</p>
    <dl class="spec"><div><dt>Material</dt><dd>${p.material}</dd></div><div><dt>Height</dt><dd>${p.dims[0].slice(2)}</dd></div><div><dt>Width</dt><dd>${p.dims[1].slice(2)}</dd></div><div><dt>Payment</dt><dd>Simulated</dd></div>${S.inv ? `<div><dt>Stock</dt><dd>${p.stock === 0 ? "Sold out" : p.stock + " units"}</dd></div>` : ""}</dl>
    ${sold ? '<div class="notice bad"><span>Sold out. This object cannot be added to the slip right now.</span></div>' : ""}
    <div class="row"><div class="qty"><button data-q="-1" aria-label="Decrease quantity">−</button><output id="qv" class="num">${S.qty}</output><button data-q="1" aria-label="Increase quantity">+</button></div>
    <button class="btn sig" id="addn" data-id="${p.id}" ${sold || S.state === "pending" ? "disabled" : ""}>${S.state === "pending" ? "Adding…" : "Add to slip"}</button></div></div></div>`;
}

/* slip drawer */
function openSlip(on) {
  $("#scrim").hidden = !on; $("#drawer").hidden = !on; if (!on) return;
  const L = S.state === "empty" && route().name === "cart" ? [] : lines(); const st = route().name === "cart" ? S.state : "filled";
  const emp = !L.length || st === "empty";
  $("#drawer").innerHTML = `<div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">Order slip</h2><button class="btn line sm" id="dclose" aria-label="Close order slip">Close ✕</button></div>
  <div class="lines">${st === "error" ? '<div class="notice bad" role="alert"><span>The slip could not be updated. Your items are unchanged.</span></div>' : ""}${st === "pending" ? '<div class="notice plain" role="status"><span>Updating your slip…</span></div>' : ""}
  ${emp ? `<div class="empty">${ICON.box}<h3>Your slip is empty</h3><p class="notes">Add an object from the catalog to start.</p><button class="btn line sm" data-close="market">Browse catalog</button></div>` : L.map(({ p, q }) => `<div class="line"><div class="th">${art(p)}</div><div><h4>${esc(p.name)}</h4><small class="mono num">${fmt(p.price)} each</small><div class="qty"><button data-dec="${p.id}" aria-label="Remove one ${esc(p.name)}">−</button><output class="num">${q}</output><button data-inc="${p.id}" aria-label="Add one ${esc(p.name)}">+</button></div></div><strong class="mono num">${fmt(p.price * q)}</strong></div>`).join("")}</div>
  <div class="slip-paper"><div class="tot"><span>TOTAL</span><span class="num">${emp ? "0.00" : fmt(total())}</span></div><button class="btn sig block" id="gocheckout" ${emp ? "disabled" : ""}>Go to checkout</button></div>`;
  $("#dclose")?.focus();
}
$("#slipbtn").onclick = () => { if (route().name !== "market" && route().name !== "cart") { go("cart"); } else go("cart"); };
$("#scrim").onclick = () => go("market");
document.addEventListener("keydown", e => { if (e.key === "Escape" && route().name === "cart") go("market"); });
$("#drawer").addEventListener("click", e => { const t = e.target.closest("button"); if (!t) return; if (t.id === "dclose") go("market"); else if (t.id === "gocheckout") go("checkout"); else if (t.dataset.inc) { S.cart[t.dataset.inc]++; render(); } else if (t.dataset.dec) { S.cart[t.dataset.dec]--; if (S.cart[t.dataset.dec] <= 0) delete S.cart[t.dataset.dec]; render(); } else if (t.dataset.close) go(t.dataset.close); });

/* checkout, payment, order */
function vCheckout() {
  const L = S.state === "empty" ? [] : lines();
  if (!L.length) return `${stepRail(1)}<div class="empty">${ICON.box}<h2>Nothing to check out</h2><p class="notes">Your slip is empty.</p><a class="btn sig" href="#market">Browse catalog</a></div>`;
  return `${stepRail(1)}<div class="split"><section class="panel" aria-labelledby="ch"><h2 id="ch">Check your slip</h2>
    ${S.state === "changed" ? '<div class="notice" role="status"><span>Your slip changed since the last payment. Run the payment again.</span></div>' : ""}
    <div class="slip-paper">${slipLines(L)}<hr><div class="tot"><span>TOTAL</span><span class="num">${fmt(total())}</span></div></div></section>
  <section class="panel" aria-labelledby="ph"><h2 id="ph">Simulated payment</h2><div class="notice"><span>⚠ This is a local simulation. No real payment is made and no card or personal information should be entered. Creating an order is a separate step.</span></div>
    <fieldset class="opts"><legend class="label" style="margin-bottom:8px">Demo outcome</legend>${[["approve", "Approve", "A decision is recorded for this slip."], ["decline", "Decline", "The payment fails. Your slip stays as it is."], ["temporary-failure", "Temporary failure", "The simulator fails. Try again."]].map(([v, t, d]) => `<label class="opt"><input type="radio" name="out" value="${v}" ${S.outcome === v ? "checked" : ""}><span><strong>${t}</strong><span>${d}</span></span></label>`).join("")}</fieldset>
    <button class="btn sig block" id="pay">Simulate payment · ${fmt(total())}</button><a class="btn line block" href="#market">Keep shopping</a></section></div>`;
}
$("#app").addEventListener("change", e => { if (e.target.name === "out") { S.outcome = e.target.value; } });
function vPayment() {
  const st = S.state, L = lines().length ? lines() : [{ p: byId("arc-lamp"), q: 2 }, { p: byId("linen-throw"), q: 1 }];
  const T = L.reduce((s, l) => s + l.p.price * l.q, 0);
  const meta = { approved: ["Payment approved", "ok", "A simulated decision was recorded for the captured slip below. No real payment was made. No order has been created."], declined: ["Payment declined", "bad", "The simulator declined this payment. Your slip is unchanged, so you can try again."], failed: ["Temporary failure", "wait", "The simulator failed. Nothing was recorded. Try again in a moment."], changed: ["Slip changed", "wait", "Your slip changed after this payment was captured. Run the payment again with the current slip."], checking: ["Checking this attempt", "plain", "Looking up the result of this payment attempt. This does not create an order."], lookup: ["Could not check", "bad", "The result could not be confirmed. Nothing was changed. Retry the check."] }[st];
  return `${stepRail(2)}<section class="panel" style="position:relative"><span class="stamp">Simulated</span><p class="label">Payment result</p><h1 style="font-size:clamp(2.4rem,6vw,4.4rem)">${meta[0]}</h1>
  <div class="notice ${meta[1] === "plain" ? "plain" : meta[1]}" ${meta[1] === "bad" ? 'role="alert"' : 'role="status"'}><span>${meta[2]}</span></div>
  <div class="slip-paper"><div class="label">Captured items</div>${slipLines(L)}<hr><div class="tot"><span>CAPTURED TOTAL</span><span class="num">${fmt(T)}</span></div></div>
  <div class="row">${st === "approved" ? '<button class="btn sig" id="mkorder">Create order</button><a class="btn line" href="#checkout">Back to checkout</a>' : st === "checking" ? '<button class="btn line" disabled>Checking…</button>' : st === "lookup" ? '<button class="btn sig">Retry check</button><a class="btn line" href="#market">Back to catalog</a>' : '<a class="btn sig" href="#checkout">Back to checkout</a><a class="btn line" href="#market">Back to catalog</a>'}</div>
  ${st === "approved" ? '<p class="notes">Create order records the frozen payment items and total. It does not clear your live slip.</p>' : ""}</section>`;
}
function vOrder() {
  const L = [{ p: byId("arc-lamp"), q: 2 }, { p: byId("linen-throw"), q: 1 }]; const T = 312.5;
  const st = S.state;
  return `${stepRail(st === "created" ? 4 : 3)}<div class="split"><section class="ticket"><span class="code">ORDER 2AFA-6574</span>
  <h1>${st === "created" ? "Order created" : st === "creating" ? "Creating your order" : "Could not create the order"}</h1>
  <p>${st === "created" ? "This order records the approved simulated payment snapshot. No real payment was made. Your live slip was not cleared and may have changed." : st === "creating" ? "Recording the frozen payment items and total. Please wait." : "The order was not recorded. The approved payment is still valid, so you can try again."}</p>
  <div class="row">${st === "error" ? '<button class="btn sig">Try again</button>' : st === "creating" ? '<button class="btn sig" disabled>Creating…</button>' : '<a class="btn sig" href="#track">Track delivery</a>'}<a class="btn line" href="#market" style="color:var(--ink)">Back to catalog</a></div></section>
  <aside class="panel"><h2>Order details</h2><ul class="tl"><li><i></i><div><strong>Payment approved</strong></div><small>10:42</small></li><li class="${st === "created" ? "" : "now"}"><i></i><div><strong>Order ${st === "created" ? "created" : "being created"}</strong></div><small>10:43</small></li><li class="todo"><i></i><div><strong>Packed</strong></div><small>next</small></li></ul>
  <div class="slip-paper">${slipLines(L)}<hr><div class="tot"><span>TOTAL</span><span class="num">${fmt(T)}</span></div></div></aside></div>`;
}

/* admin */
function vAdmin() {
  const st = S.state;
  const head = `<div class="head"><div><p class="label">Admin · Ledger</p><h1>Objects</h1></div><a class="btn sig" href="#admin-new">New object</a></div><p class="notice plain" style="margin-bottom:16px">This local surface has no access control. The catalog and Admin share the same data.</p>`;
  if (st === "empty") return head + `<div class="empty">${ICON.box}<h2>No objects yet</h2><p class="notes">Create the first synthetic object to fill the catalog.</p><a class="btn sig" href="#admin-new">Create an object</a></div>`;
  if (st === "error") return head + '<div class="notice bad" role="alert"><span>The objects could not be loaded.</span></div><p style="margin-top:12px"><button class="btn line">Retry</button></p>';
  return head + (st === "delete" ? '<div class="notice bad" role="alertdialog" aria-label="Confirm delete" style="margin-bottom:16px"><span>Delete “Terra Vessel”? This removes it from the catalog and cannot be undone.</span><span class="row" style="margin-left:auto"><button class="btn sm">Delete</button><button class="btn line sm">Cancel</button></span></div>' : "") +
  `<div class="ledger"><table><thead><tr><th>Image</th><th>No.</th><th>Name</th><th class="r">Price</th><th class="r">Actions</th></tr></thead><tbody>${products.map(p => `<tr><td><div class="th">${art(p)}</div></td><td class="m">${p.no}</td><td><strong>${esc(p.name)}</strong></td><td class="r m num">${fmt(p.price)}</td><td class="r"><a class="btn line sm" href="#admin-edit-${p.id}">Edit</a> <button class="btn line sm" data-del="${p.id}">Delete</button></td></tr>`).join("")}</tbody></table></div>`;
}
function vForm(r) {
  const edit = r.name === "admin-edit", p = edit ? byId(r.id) || products[0] : null;
  if (edit && S.state === "gone") return `<a class="crumb" href="#admin">← Back to objects</a><div class="empty"><h2>This object no longer exists</h2><p class="notes">It may have been deleted. Go back to the list.</p><a class="btn sig" href="#admin">Back to objects</a></div>`;
  S.draft = p ? { ...p } : { name: "", price: "", description: "", stage: 1, art: S.state === "upload" ? "blank" : "blank", image: null };
  const inv = S.state === "invalid";
  return `<a class="crumb" href="#admin">← Back to objects</a><div class="head"><h1>${edit ? "Edit object" : "New object"}</h1></div>
  <form class="form" id="pf" novalidate><section class="panel">
    <div class="field ${inv ? "bad" : ""}"><label for="f-name">Name</label><input id="f-name" value="${esc(S.draft.name)}"><span class="err" role="alert">${inv ? "Enter an object name." : ""}</span></div>
    <div class="field ${inv ? "bad" : ""}"><label for="f-price">Price</label><input id="f-price" inputmode="decimal" value="${S.draft.price}" placeholder="0.00"><span class="err" role="alert">${inv ? "Enter a price greater than 0." : ""}</span></div>
    <div class="field"><label for="f-desc">Description</label><textarea id="f-desc">${esc(S.draft.description)}</textarea></div>
    <div class="row"><button class="btn sig" type="submit">${edit ? "Save changes" : "Create object"}</button><a class="btn line" href="#admin">Cancel</a></div></section>
  <section class="panel"><h2>Image</h2><div class="drop" id="drop"><div class="prev" id="prev">${S.state === "upload" ? art({ name: "Uploaded image", art: "bench", stage: 3 }).replace("<svg", '<svg style="background:var(--stage-3)"') : art(S.draft)}</div><div class="ctl"><strong class="mono" style="font-size:.85rem">${S.state === "upload" ? "UPLOADED · bench.jpg" : "DROP AN IMAGE HERE"}</strong><span class="label">JPG or PNG · up to 2 MB</span><label class="btn line sm" for="f-file" style="cursor:pointer">Choose file</label><input id="f-file" type="file" accept="image/jpeg,image/png" hidden><span class="err" role="alert" id="e-file">${S.state === "badfile" ? "Use a JPG or PNG file." : ""}</span></div></div>
  <div><p class="label" style="margin-bottom:8px">Or pick a stage color</p><div class="sws" id="sws">${[1, 2, 3, 4].map(n => `<button type="button" class="sw" style="background:var(--stage-${n})" data-c="${n}" aria-label="Stage color ${n}" aria-pressed="${S.draft.stage === n}"></button>`).join("")}</div></div></section></form>`;
}
function bindForm() {
  const f = $("#pf"); const file = $("#f-file");
  file.onchange = () => { const x = file.files[0]; if (!x) return; if (!/^image\/(jpeg|png)$/.test(x.type)) { $("#e-file").textContent = "Use a JPG or PNG file."; return; } if (x.size > 2097152) { $("#e-file").textContent = "File is larger than 2 MB."; return; } const fr = new FileReader(); fr.onload = () => { S.draft.image = fr.result; $("#prev").innerHTML = art(S.draft); $("#e-file").textContent = ""; }; fr.readAsDataURL(x); };
  $("#sws").onclick = e => { const b = e.target.closest(".sw"); if (!b) return; S.draft.stage = +b.dataset.c; S.draft.image = null; $("#prev").innerHTML = art(S.draft); document.querySelectorAll(".sw").forEach(s => s.setAttribute("aria-pressed", String(s === b))); };
  f.onsubmit = e => { e.preventDefault(); const name = $("#f-name").value.trim(), price = parseFloat($("#f-price").value.replace(",", ".")); if (!name || !(price > 0)) { S.state = "invalid"; render(); return; } toast("Saved (prototype only)"); go("admin"); };
}
function vNotFound() { return `<div class="empty">${ICON.box}<p class="label">Error 404</p><h1 style="font-size:clamp(3rem,10vw,7rem)">Not on the shelf</h1><p class="notes">This address does not match any screen. Go back to the catalog.</p><a class="btn sig" href="#market">Back to catalog</a></div>`; }

/* next: account */
function vAccount() {
  const c = S.state === "create";
  return `<span class="fut">Next · design only · needs authentication before any hosted use</span><div class="split"><section class="ticket"><span class="code">MEMBER AREA</span><h1>${c ? "Open an account" : "Sign in"}</h1><p>Keep your orders and delivery updates in one place. In the demo, use any synthetic email. No real data.</p></section>
  <section class="panel"><h2>${c ? "Create account" : "Welcome back"}</h2><div class="field"><label for="a-e">Email</label><input id="a-e" type="email" placeholder="you@example.test"></div>${c ? '<div class="field"><label for="a-n">Name</label><input id="a-n" placeholder="Synthetic name"></div>' : ""}<div class="field"><label for="a-p">Password</label><input id="a-p" type="password" placeholder="••••••••"></div>
  <button class="btn sig block">${c ? "Create account" : "Sign in"}</button><button class="link" data-switch="${c ? "signin" : "create"}">${c ? "I already have an account" : "Create an account"}</button></section></div>`;
}
/* next: orders */
function vOrders() {
  const os = [["2AFA-6574", "27 Nov", 312.5, "Packed", "wait"], ["91C2-0D1E", "14 Nov", 68, "Delivered", "ok"], ["77B0-A3F9", "02 Nov", 454, "Delivered", "ok"]];
  return `<span class="fut">Next · design only</span><div class="head"><div><p class="label">Account</p><h1>Your orders</h1></div></div>` + (S.state === "empty" ? `<div class="empty">${ICON.box}<h2>No orders yet</h2><p class="notes">Orders you place appear here.</p><a class="btn sig" href="#market">Browse catalog</a></div>` :
    `<div class="ledger"><table><thead><tr><th>Order</th><th>Date</th><th>Status</th><th class="r">Total</th><th class="r"></th></tr></thead><tbody>${os.map(o => `<tr><td class="m">${o[0]}</td><td>${o[1]}</td><td><span class="pill ${o[4]}">${o[3]}</span></td><td class="r m num">${fmt(o[2])}</td><td class="r"><a class="btn line sm" href="#track">Track</a></td></tr>`).join("")}</tbody></table></div>`);
}
/* next: tracking */
function vTrack() {
  const st = S.state; const steps = [["Order created", "27 Nov · 10:43", 1], ["Packed", "27 Nov · 14:10", 1], ["Left the warehouse", "28 Nov · 08:02", st !== "transit" || 1], ["Out for delivery", "29 Nov · 09:30", st === "delivered" ? 1 : 0], ["Delivered", "29 Nov · 13:12", st === "delivered" ? 1 : 0]];
  return `<span class="fut">Next · design only · couriers and notifications are simulated</span><div class="head"><div><p class="label">Order 2AFA-6574</p><h1>${st === "delivered" ? "Delivered" : st === "delayed" ? "Running late" : "On its way"}</h1></div><span class="pill ${st === "delivered" ? "ok" : st === "delayed" ? "bad" : "wait"}">${st === "delivered" ? "Delivered" : st === "delayed" ? "Delayed 1 day" : "In transit"}</span></div>
  <div class="split"><section class="panel"><h2>Route</h2><svg viewBox="0 0 400 140" role="img" aria-label="Delivery route from warehouse to destination" style="width:100%"><path d="M30 100C100 20 160 120 220 70S340 40 372 60" fill="none" stroke="var(--hair)" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/><path d="M30 100C100 20 160 120 220 70" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><circle cx="30" cy="100" r="9" fill="var(--ink)"/><circle cx="372" cy="60" r="9" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/><circle cx="220" cy="70" r="11" fill="var(--signal)" stroke="var(--ink)" stroke-width="3"/><text x="30" y="125" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--ink)">WAREHOUSE</text><text x="300" y="42" font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--ink)">YOU</text></svg>
  ${st === "delayed" ? '<div class="notice bad" role="status"><span>The courier reports a delay. New estimate: 30 Nov.</span></div>' : '<div class="notice plain"><span>Courier: Simulated Express · Tracking SK-0042-17</span></div>'}</section>
  <aside class="panel"><h2>Progress</h2><ul class="tl">${steps.map(([t, d, done], i) => `<li class="${done ? "" : (steps[i - 1] || [0, 0, 1])[2] ? "now" : "todo"}"><i></i><div><strong>${t}</strong></div><small>${done ? d : "est."}</small></li>`).join("")}</ul>
  <h3 style="font-size:1.2rem;margin-top:6px">Updates you will get</h3><div class="toasts"><div class="toast-s"><b>Order packed</b>Your order is packed and waiting for the courier.</div><div class="toast-s"><b>Out for delivery</b>Arriving today between 9:00 and 13:00.</div></div></aside></div>`;
}
/* next: ops */
function spark(vals, color) { const w = 160, h = 36, mx = Math.max(...vals), mn = Math.min(...vals); const pts = vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - 4 - (v - mn) / (mx - mn || 1) * (h - 8)).toFixed(1)}`); return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="2"/><circle cx="${pts[pts.length - 1].split(",")[0]}" cy="${pts[pts.length - 1].split(",")[1]}" r="3.5" fill="${color}"/></svg>`; }
function vOps() {
  const svc = [["Catalog", "ok", "p95 42 ms"], ["Cart", "ok", "p95 31 ms"], ["Payment simulator", "wait", "p95 180 ms"], ["Orders · PostgreSQL", "ok", "p95 64 ms"]];
  return `<span class="fut">Next · design only · roadmap v0.7 observability and v0.8 dashboards</span><div class="head"><div><p class="label">Operations</p><h1>Store health</h1></div><p>Synthetic figures for layout only. Each number would link to the question it answers.</p></div>
  <div class="kpis"><div class="kpi"><span class="label">Orders / hour</span><b class="num">128</b>${spark([60, 72, 90, 88, 104, 120, 128], "var(--ink)")}</div><div class="kpi"><span class="label">Approval rate</span><b class="num">94.2%</b>${spark([96, 95, 95, 93, 94, 92, 94], "var(--ink)")}</div><div class="kpi"><span class="label">Checkout p95</span><b class="num">212 ms</b>${spark([180, 190, 205, 198, 240, 220, 212], "var(--signal)")}</div><div class="kpi"><span class="label">Errors</span><b class="num">0.3%</b>${spark([0.1, 0.2, 0.2, 0.5, 0.4, 0.3, 0.3], "var(--ink)")}</div></div>
  <div class="ledger"><table><thead><tr><th>Service</th><th>Status</th><th class="r">Latency</th></tr></thead><tbody>${svc.map(s => `<tr><td><strong>${s[0]}</strong></td><td><span class="pill ${s[1]}">${s[1] === "ok" ? "Healthy" : "Degraded"}</span></td><td class="r m">${s[2]}</td></tr>`).join("")}</tbody></table></div>`;
}
/* next: mobile */
function vMobile() {
  const mini = p => `<div class="obj"><div class="stage ${stageCls(p)}" style="border-width:1.5px">${art(p)}<span class="tag num" style="left:6px;bottom:6px;font-size:.75rem;padding:2px 8px 2px 16px">${fmt(p.price)}</span></div><h3 style="font-size:1rem">${esc(p.name)}</h3></div>`;
  const tabs = '<div class="tabbar"><span>Catalog</span><span>Search</span><span>Slip</span><span>Orders</span></div>';
  const p = byId("terra-vessel");
  return `<span class="fut">Next · design only · roadmap v0.6 React Native</span><div class="head"><div><p class="label">Mobile app</p><h1>In your pocket</h1></div><p>Same identity, thumb-first: a tab bar for the four jobs, large tap targets, and the slip as a bottom sheet.</p></div>
  <div class="phones"><div class="phone"><div class="scr"><b class="mono" style="font-size:.8rem">SAMSKA STORE</b><div class="g2">${products.slice(0, 4).map(mini).join("")}</div>${tabs}</div></div>
  <div class="phone"><div class="scr"><span class="label">← Catalog</span><div class="stage ${stageCls(p)}">${art(p)}<span class="no">No. ${p.no}</span></div><h2 style="font-size:1.6rem">${p.name}</h2><span class="bigprice num" style="font-size:1.5rem">${fmt(p.price)}</span><button class="btn sig block">Add to slip</button>${tabs}</div></div>
  <div class="phone"><div class="scr"><h2 style="font-size:1.6rem">Order slip</h2><div class="slip-paper" style="font-size:.78rem">${slipLines(lines())}<hr><div class="tot"><span>TOTAL</span><span class="num">${fmt(total())}</span></div></div><button class="btn sig block">Checkout</button>${tabs}</div></div></div>`;
}

/* actions */
$("#app").addEventListener("click", e => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.dataset.add) { S.cart[t.dataset.add] = (S.cart[t.dataset.add] || 0) + 1; $("#slipcount").textContent = count(); toast(`${byId(t.dataset.add).name} added to slip`); }
  else if (t.dataset.sort) { S.sort = t.dataset.sort; document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.sort === S.sort))); paintGrid(); }
  else if (t.id === "clr") { S.q = ""; $("#q").value = ""; paintGrid(); }
  else if (t.id === "retry") { S.state = "normal"; render(); }
  else if (t.dataset.q) { S.qty = Math.max(1, S.qty + Number(t.dataset.q)); $("#qv").textContent = S.qty; }
  else if (t.id === "addn") { S.cart[t.dataset.id] = (S.cart[t.dataset.id] || 0) + S.qty; S.qty = 1; render(); toast("Added to slip"); }
  else if (t.id === "pay") { S.state = S.outcome === "approve" ? "approved" : S.outcome === "decline" ? "declined" : "failed"; go("payment"); render(); }
  else if (t.id === "mkorder") { S.state = "created"; go("order"); }
  else if (t.dataset.switch) { S.state = t.dataset.switch; render(); }
  else if (t.dataset.del) { S.state = "delete"; render(); }
});
$("#screenSel").onchange = e => { const v = e.target.value; S.state = ""; go(v === "product" ? "product-" + products[1].id : v === "admin-edit" ? "admin-edit-" + products[0].id : v); };
$("#stateSel").onchange = e => { S.state = e.target.value; render(); };
$("#invSel").onchange = e => { S.inv = e.target.value === "on"; render(); };
$("#themeBtn").onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; };
fillSelectors(); render();
</script>
