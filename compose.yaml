services:
  postgres:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: samska
      POSTGRES_USER: samska_dev
      POSTGRES_PASSWORD: >-
        ${POSTGRES_PASSWORD:?}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
