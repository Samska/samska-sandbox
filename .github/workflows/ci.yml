name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - main

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate pull request handoff headings
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          missing=0
          while IFS= read -r heading; do
            if ! printf '%s\n' "$PR_BODY" | grep -Fxq -- "$heading"; then
              printf 'Missing handoff heading: %s\n' "$heading"
              missing=1
            fi
          done <<'HEADINGS'
          # Pull Request Handoff
          ## Issue reference
          ## Confirmed implementation state
          ## Files changed
          ## Decisions and deviations
          ## Agent Verification
          ## Human Verification
          ## CI Verification
          ## Documentation impact
          ## Remaining risks
          ## Next step
          ## PROJECT_HANDOFF update
          ## Local Environment Changes
          HEADINGS
          if [ "$missing" -ne 0 ]; then
            printf 'The pull request body must include the canonical handoff headings from .github/pull_request_template.md.\n'
            exit 1
          fi

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}
        run: docker compose config --quiet

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: .markdownlint.yaml
          globs: "**/*.md"

      - name: Check local Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress "**/*.md"
          lycheeVersion: v0.24.2

      - name: Check EditorConfig
        uses: editorconfig-checker/action-editorconfig-checker@840e866d93b8e032123c23bac69dece044d4d84c # v2.2.0
        with:
          version: v3.11.2

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Eclipse Temurin 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test backend
        id: test
        continue-on-error: true
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Publish backend test results
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          check_name: Backend test results
          report_paths: backend/target/surefire-reports/TEST-*.xml
          group_reports: true
          fail_on_failure: false
          fail_on_parse_error: true
          require_tests: true
          job_summary: true
          detailed_summary: true
          include_passed: true
          group_suite: true
          include_time_in_summary: true

      - name: Annotate backend test results from forks
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          check_name: Backend test results
          report_paths: backend/target/surefire-reports/TEST-*.xml
          group_reports: true
          annotate_only: true
          fail_on_failure: false
          fail_on_parse_error: true
          require_tests: true
          job_summary: true
          detailed_summary: true
          include_passed: true
          group_suite: true
          include_time_in_summary: true

      - name: Upload backend JUnit XML
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-junit-xml
          path: backend/target/surefire-reports/TEST-*.xml
          retention-days: 7
          if-no-files-found: error

      - name: Preserve backend test failure
        if: ${{ always() && steps.test.outcome == 'failure' }}
        run: exit 1

      # Rebuild R1 candidate (R10 support): the standard runtime keeps its own
      # verify above; the Maven `rebuild` profile builds the new
      # io.github.samska.commerce entry with its own test run.
      - name: Build and test rebuild backend
        run: ./mvnw -Prebuild --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test frontend
        id: test
        continue-on-error: true
        run: |
          mkdir -p test-results
          npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml

      - name: Publish frontend test results
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          check_name: Frontend test results
          report_paths: web/test-results/junit.xml
          group_reports: true
          fail_on_failure: false
          fail_on_parse_error: true
          require_tests: true
          job_summary: true
          detailed_summary: true
          include_passed: true
          group_suite: true
          include_time_in_summary: true

      - name: Annotate frontend test results from forks
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          check_name: Frontend test results
          report_paths: web/test-results/junit.xml
          group_reports: true
          annotate_only: true
          fail_on_failure: false
          fail_on_parse_error: true
          require_tests: true
          job_summary: true
          detailed_summary: true
          include_passed: true
          group_suite: true
          include_time_in_summary: true

      - name: Upload frontend JUnit XML
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-junit-xml
          path: web/test-results/junit.xml
          retention-days: 7
          if-no-files-found: error

      - name: Preserve frontend test failure
        if: ${{ always() && steps.test.outcome == 'failure' }}
        run: exit 1

      - name: Build frontend
        if: ${{ steps.test.outcome == 'success' }}
        run: npm run build

      # Rebuild R1 candidate frontend checks, run strictly after the standard
      # ones (scripts integrated into web/package.json by the Orquestrador).
      - name: Run rebuild frontend checks
        run: |
          npm run test:lifecycle:rebuild
          npm run typecheck:rebuild
          npm run test:rebuild
          npm run build:rebuild
          npm run a11y:contrast:rebuild

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Eclipse Temurin 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        working-directory: web
        run: npm run test:e2e

      # Rebuild R1 candidate E2E, strictly sequential after the standard suite
      # so the candidate launcher starts with 8080/5173 already released by
      # the standard webServers; the launcher refuses occupied ports without
      # stopping their owner.
      - name: Run rebuild browser E2E tests
        working-directory: web
        run: npm run test:e2e:rebuild

      - name: Upload Playwright diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore
